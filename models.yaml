# Model registry. Prices are $/million tokens; update by hand with as_of.
# CLI models run through the owner's subscriptions and are labelled "via CLI" in reports.
models:
  - id: ollama-qwen3-8b
    access: local
    inspect_model: ollama/qwen3:8b
    pinned: "500a1f067a9f"  # ollama qwen3:8b Q4_K_M, pulled 2026-11-22 (report used full precision)
    caps: [text, reasoning, json, "ctx:32000"]
    params: {temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 32768}  # Qwen3 report thinking-mode settings
    role: reference
    sealed_ok: true

  # DeepSeek: names and peak prices from api-docs.deepseek.com/quick_start/pricing, read 2026-11-22.
  # Off-peak is half price; peak is used so budget estimates err high. Thinking is on by default.
  - id: deepseek-flash
    access: api
    inspect_model: deepseek/deepseek-flash      # DeepSeek-V4.1-Flash-1017
    caps: [text, json, tools, reasoning, "ctx:1000000"]
    price: {input: 0.3, output: 1.2, input_cache_read: 0.006, as_of: 2026-11-22}
    sealed_ok: false

  - id: deepseek-v4-pro
    access: api
    inspect_model: deepseek/deepseek-v4-pro     # DeepSeek-V4-Pro-0813
    caps: [text, json, tools, reasoning, "ctx:1000000"]
    price: {input: 1.32, output: 3.96, input_cache_read: 0.044, as_of: 2026-11-22}
    sealed_ok: false

  - id: claude-cli-opus-5-5
    access: cli
    inspect_model: claude-cli/claude-opus-5-5   # exact id, not the moving "opus" alias
    caps: [text, reasoning, json, "ctx:200000"]
    params: {effort: high}
    sealed_ok: true

  - id: claude-cli-sonnet-5-5
    access: cli
    inspect_model: claude-cli/claude-sonnet-5-5
    caps: [text, reasoning, json, "ctx:200000"]
    sealed_ok: true

  - id: codex-cli-default
    access: cli
    inspect_model: codex-cli/gpt-6.2-astra
    caps: [text, reasoning, json, "ctx:200000"]
    sealed_ok: true
