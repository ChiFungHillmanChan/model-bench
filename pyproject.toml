[project]
name = "model-bench"
version = "0.1.0"
description = "Private model benchmark and test harness built on Inspect AI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "inspect-ai==0.3.291",
    "inspect-evals==0.29.0",
    "duckdb>=1.1",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1",
    "numpy>=2",
]

[project.scripts]
bench = "model_bench.cli:app"

[project.entry-points.inspect_ai]
model_bench = "model_bench.providers._registry"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real models (paid or subscription quota); run with -m live"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
