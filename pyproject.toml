[project]
name = "model-bench"
version = "0.1.0"
description = "Private model benchmark and test harness built on Inspect AI"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "inspect-ai==0.3.291",
    "inspect-evals==0.29.0",
    "duckdb>=1.1",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1",
    "numpy>=2",
    # IFEval scorer (inspect_evals extra "ifeval"); not on PyPI, pinned to a commit
    "instruction_following_eval @ git+https://github.com/josejg/instruction_following_eval@0c495b2f95155e8b10acb919ae283bfb4d5be6e2",
    "langdetect>=1.0.9",
    "openai>=3.57.0",
    "matplotlib==3.11.2",
    "playwright==1.65.2",
    "opencc-python-reimplemented==0.1.7",
]

[project.scripts]
bench = "model_bench.cli:app"

[project.entry-points.inspect_ai]
model_bench = "model_bench.providers._registry"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/model_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real models (paid or subscription quota); run with -m live"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
